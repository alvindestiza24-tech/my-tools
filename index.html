<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Tools AoXue</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="splash-screen" id="splash">
        <div class="bintang-container">
            <div class="bintang"></div>
            <div class="bintang"></div>
            <div class="bintang"></div>
            <div class="bintang"></div>
            <div class="bintang"></div>
            <div class="bintang"></div>
            <div class="bintang"></div>
            <div class="bintang"></div>
            <div class="bintang"></div>
            <div class="bintang"></div>
            <div class="bintang"></div>
            <div class="bintang"></div>
            <div class="bintang"></div>
            <div class="bintang"></div>
            <div class="bintang"></div>

            <div class="bintang bawah"></div>
            <div class="bintang bawah"></div>
            <div class="bintang bawah"></div>
            <div class="bintang bawah"></div>
            <div class="bintang bawah"></div>
            <div class="bintang bawah"></div>
            <div class="bintang bawah"></div>
            <div class="bintang bawah"></div>
            <div class="bintang bawah"></div>
            <div class="bintang bawah"></div>
            <div class="bintang bawah"></div>
            <div class="bintang bawah"></div>
            <div class="bintang bawah"></div>
            <div class="bintang bawah"></div>
            <div class="bintang bawah"></div>
        </div>

        <div class="bintang-putar"></div>

        <div class="splash-title">👾 AoXue</div>
        <div class="splash-sub">by AoXue</div>
    </div>

    <div class=" floating-notif" id="floatingNotif">
        <div class="notif-content">
            <div class="notif-icon"><i class="fas fa-info-circle"></i></div>
            <h3>Selamat Datang! 👋</h3>
            <p>Selamat menggunakan web tools ini. Semoga bermanfaat!</p>
            
            <button class="notif-btn" onclick="closeNotif()" style="cursor:pointer; width:100%; border:none;">
                <i class="fas fa-check-circle"></i> Oke, Mengerti
            </button>
        </div>
    </div>

    <div class="bg-glow"></div>

    <div class="video-banner">
        <img src="7a13a656aa0d48749bd6f66f0a2690a1.gif" alt="Bamboo Banner" class="banner-gif">
        
        <div class="video-overlay">
            <h1>👾  AoXue <span>By AoXue</span></h1>
        </div>
    </div>

    <div class="container">

        <div class="user-card" id="userCard">
            <div class="user-avatar"><i class="fas fa-user"></i></div>
            <div class="user-info">
                <div class="item">
                    <i class="fas fa-globe"></i>
                    <span class="label">Negara</span>
                    <span class="value" id="userCountry">Loading...</span>
                </div>
                <div class="item">
                    <i class="fas fa-mobile-alt"></i>
                    <span class="label">Device</span>
                    <span class="value" id="userDevice">Loading...</span>
                </div>
                <div class="item">
                    <i class="fas fa-globe"></i>
                    <span class="label">Browser</span>
                    <span class="value" id="userBrowser">Loading...</span>
                </div>
                <div class="item">
                    <i class="fas fa-signal"></i>
                    <span class="label">Status</span>
                    <span class="value online" id="userStatus">● Online</span>
                </div>
                <div class="item">
                    <div class="battery-bar">
                        <i class="fas fa-battery-three-quarters" style="color:#22c55e;font-size:12px;"></i>
                        <div class="level"><div class="fill" id="batteryFill" style="width:75%;"></div></div>
                        <span class="perc" id="batteryPercent">75%</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="nav-tabs" id="navTabs">
            <button class="nav-tab active" data-tab="all"><i class="fas fa-th-large"></i> All</button>
            <button class="nav-tab" data-tab="downloader"><i class="fas fa-download"></i> Downloader</button>
            <button class="nav-tab" data-tab="maker"><i class="fas fa-wand-magic-sparkles"></i> Maker</button>
            <button class="nav-tab" data-tab="tools"><i class="fas fa-screwdriver-wrench"></i> Tools</button>
            <button class="nav-tab" data-tab="vault"><i class="fas fa-archive"></i> Vault</button>
            <button class="nav-tab" data-tab="external"><i class="fas fa-link"></i> External</button>
        </div>

        <div id="tab-all" class="tab-content active">
            <div class="section-title">
                <i class="fas fa-th-large" style="color:#a78bfa;"></i> Semua Tools
                <span class="line"></span>
            </div>
            <div class="tools-grid" id="allGrid"></div>
        </div>

        <div id="tab-downloader" class="tab-content">
            <div class="section-title">
                <i class="fas fa-download" style="color:#a78bfa;"></i> Downloader
                <span class="line"></span>
            </div>
            <div class="tools-grid" id="downloaderGrid"></div>
        </div>

        <div id="tab-maker" class="tab-content">
            <div class="section-title">
                <i class="fas fa-wand-magic-sparkles" style="color:#a78bfa;"></i> Maker
                <span class="line"></span>
            </div>
            <div class="tools-grid" id="makerGrid"></div>
        </div>

        <div id="tab-tools" class="tab-content">
            <div class="section-title">
                <i class="fas fa-screwdriver-wrench" style="color:#a78bfa;"></i> Tools
                <span class="line"></span>
            </div>
            <div class="tools-grid" id="toolsGrid"></div>
        </div>

        <div id="tab-vault" class="tab-content">
            <div class="section-title">
                <i class="fas fa-archive" style="color:#a78bfa;"></i> Vault
                <span class="line"></span>
            </div>
            <div class="tools-grid" id="vaultGrid"></div>
        </div>

        <div id="tab-external" class="tab-content">
            <div class="section-title">
                <i class="fas fa-link" style="color:#a78bfa;"></i> External Tools
                <span class="line"></span>
            </div>
            <div class="tools-grid" id="externalGrid"></div>
        </div>

        <div class="footer">
            <i class="fas fa-bolt"></i> All Tools AoXue· by AoXue
        </div>
    </div>

    <div class="tool-viewer" id="toolViewer">
        <div class="tool-viewer-content" id="toolViewerContent">
            <button class="tool-viewer-close" onclick="closeTool()"><i class="fas fa-times"></i></button>
            <div id="toolViewerBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
